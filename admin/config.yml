backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "noticias"
    label: "Notícias"
    folder: "data/noticias"
    create: true
    format: "json"
    slug: "{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Subtítulo / Resumo", name: "summary", widget: "text"}
      - {label: "Data", name: "date", widget: "datetime"}
      - {label: "Autor", name: "author", widget: "string"}
      - {label: "Categoria / Tema", name: "category", widget: "select", options: ["mundo", "politica", "economia", "esportes", "tecnologia", "cultura"]}
      - {label: "Imagem Principal", name: "image", widget: "image"}
      - {label: "Conteúdo da Notícia", name: "body", widget: "markdown"}

  - name: "artigos"
    label: "Artigos"
    folder: "data/artigos"
    create: true
    format: "json"
    slug: "{{slug}}"
    fields:
      - {label: "Título do Artigo", name: "title", widget: "string"}
      - {label: "Resumo", name: "summary", widget: "text"}
      - {label: "Data de Publicação", name: "date", widget: "datetime"}
      - {label: "Nome do Autor", name: "author", widget: "string"}
      - {label: "Imagem / Capa", name: "image", widget: "image"}
      - {label: "Texto do Artigo", name: "body", widget: "markdown"}

  - name: "podcasts"
    label: "Podcasts"
    folder: "data/podcasts"
    create: true
    format: "json"
    slug: "{{slug}}"
    fields:
      - {label: "Título do Episódio", name: "title", widget: "string"}
      - {label: "Número do Episódio", name: "episode", widget: "string"}
      - {label: "Link do Vídeo no YouTube", name: "youtube_url", widget: "string"}
      - {label: "Data", name: "date", widget: "datetime"}
      - {label: "Descrição do Episódio", name: "summary", widget: "text"}
      - {label: "Capa do Episódio", name: "image", widget: "image"}
